server.modules = (
        "mod_access",
        "mod_alias",
        "mod_compress",
        "mod_redirect",
        "mod_accesslog",
        "mod_proxy",
        "mod_rewrite",
        "mod_dirlisting"
)

$HTTP["url"] =~ "^(.*)/v1/textpresso/api" {
  proxy.server  = ( "" => ("" => ( "host" => "127.0.0.1", "port" => 8081 )))
}

# CAS2 ontology annotation service (cas_annotate_server.py). Deliberately a
# path disjoint from "/v1/textpresso/api" above (shares only the
# "/v1/textpresso/" prefix, not "api") so this rule can never match the same
# request as the block above -- adding it cannot change existing API routing.
$HTTP["url"] =~ "^(.*)/v1/textpresso/annotate" {
  proxy.server  = ( "" => ("" => ( "host" => "127.0.0.1", "port" => 8082 )))
}

# Ontology category lookup (category_index.py, same cas_annotate_server.py
# process/port as the annotate rule above). Path shares no substring with
# either "/v1/textpresso/api" or "/v1/textpresso/annotate", so it can't
# match the same request as either existing rule.
$HTTP["url"] =~ "^(.*)/v1/textpresso/category_search" {
  proxy.server  = ( "" => ("" => ( "host" => "127.0.0.1", "port" => 8082 )))
}

$SERVER["socket"] == ":8081" {
  url.rewrite-once = ( "^(.*)/v1/textpresso/api/(.*)" => "/v1/textpresso/api/$2" )
  proxy.server  = ( "" => ( "" => ( "host" => "127.0.0.1", "port" => 18080 )))
}

url.rewrite-once = ( "^(.*)/tpc/images/(.*)" => "$1/images/$2" )

#set doc root to tpc root
server.document-root        = "/usr/lib/cgi-bin/tc/"
server.upload-dirs          = ( "/var/cache/lighttpd/uploads" )
server.errorlog             = "/var/log/lighttpd/error.log"
server.pid-file             = "/var/run/lighttpd.pid"
server.username             = "www-data"
server.groupname            = "www-data"
server.port                 = 80

index-file.names            = ( "index.php", "index.html", "index.lighttpd.html" )
url.access-deny             = ( "~", ".inc" )
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

compress.cache-dir          = "/var/cache/lighttpd/compress/"
compress.filetype           = ( "application/javascript", "text/css", "text/html", "text/plain" )

# default listening port for IPv6 falls back to the IPv4 port
## Use ipv6 if available
#include_shell "/usr/share/lighttpd/use-ipv6.pl " + server.port
include_shell "/usr/share/lighttpd/create-mime.assign.pl"
include_shell "/usr/share/lighttpd/include-conf-enabled.pl"

server.breakagelog = "/var/log/lighttpd/breakage.log"
accesslog.filename = "/var/log/lighttpd/access.log"

#configure tpc cgi
server.modules += ( "mod_fastcgi" )
fastcgi.server += ("/tpc" =>
                   ("tpc" =>
                     ("socket" => "/usr/wt/socket",
                      "bin-path" => "/usr/lib/cgi-bin/tc/tpc",
                      "max-procs" => 100,
                      "idle-timeout" => 60,
                      "check-local" => "enable",
                      "bin-environment" => ("FOO" => "bar")
                     )
                    )
                )
#redirect root to tpc
url.redirect = (
  "^/$" => "/tpc"
)
#increase number of files that can be opened. Required by Lucene
server.max-fds = 4096
server.max-keep-alive-idle = 100
server.max-read-idle = 100
server.max-write-idle = 360

$HTTP["url"] =~ "^/NNClassification($|/)" {
  alias.url = ( "/NNClassification" => "/data/textpresso/classifiers/" )
  dir-listing.activate = "enable"
}

$HTTP["url"] =~ "^/obofiles($|/)" {
  alias.url = ( "/obofiles" => "/data/textpresso/obofiles4production/" )
  dir-listing.activate = "enable"
}

$HTTP["url"] =~ "^/headerfiles($|/)" {
  alias.url = ( "/headerfiles" => "/data/textpresso/oboheaderfiles/" )
  dir-listing.activate = "enable"
}

